<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Interaction Effects Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* 1. Neon Glow - 외부로 강하게 뿜어져 나오는 다중 그림자 */
        .glow-active {
            box-shadow:
                0 0 10px #fff,
                0 0 20px #a855f7,
                0 0 40px #a855f7,
                0 0 60px #a855f7,
                0 0 100px #a855f7 !important;
            border-color: #f3e8ff !important;
            transform: scale(1.02);
            /* 빛이 나올 때 아주 미세한 확장만 허용 */
            z-index: 10;
        }

        /* 2. Squash & Stretch 애니메이션 */
        @keyframes squash-stretch {
            0% {
                transform: scale(1, 1);
            }

            30% {
                transform: scale(1.25, 0.75);
            }

            40% {
                transform: scale(0.75, 1.25);
            }

            50% {
                transform: scale(1.15, 0.85);
            }

            65% {
                transform: scale(0.95, 1.05);
            }

            75% {
                transform: scale(1.05, 0.95);
            }

            100% {
                transform: scale(1, 1);
            }
        }

        .animate-squash {
            animation: squash-stretch 0.6s ease-in-out;
        }

        /* 3. Ripple Effect */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 4. Particle Base */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            z-index: 100;
        }

        .btn-base {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-12 px-4">

    <div class="max-w-6xl w-full">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">Button Effects Lab</h1>
            <p class="text-lg text-slate-600 italic">"네온 글로우는 밖으로 번지고, 섬광은 안에서 터집니다."</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- Category 1: Geometric -->
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3 text-blue-600">
                    <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                    Geometric (형태 변화)
                </h2>
                <div class="space-y-4">
                    <button id="btn-scale"
                        class="btn-base w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold active:scale-90 shadow-lg shadow-blue-200">
                        Scale (스케일 다운)
                    </button>
                    <button id="btn-rotation"
                        class="btn-base w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200">
                        Rotation (360도 회전)
                    </button>
                    <button id="btn-squash"
                        class="btn-base w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-bold shadow-lg shadow-amber-200">
                        Squash & Stretch (탄성)
                    </button>
                </div>
            </div>

            <!-- Category 2: Visual & Lighting -->
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3 text-purple-600">
                    <div class="w-2 h-6 bg-purple-600 rounded-full"></div>
                    Visual & Lighting (조명)
                </h2>
                <div class="space-y-4">
                    <button id="btn-shadow"
                        class="btn-base w-full py-4 bg-white border-2 border-slate-100 text-slate-700 rounded-2xl font-bold shadow-sm">
                        Elevation (그림자 부상)
                    </button>
                    <!-- NEON GLOW: 버튼 바깥으로 보랏빛이 번져 나감 -->
                    <button id="btn-glow"
                        class="btn-base w-full py-4 bg-purple-700 text-white border-2 border-purple-400 rounded-2xl font-bold shadow-lg relative">
                        Neon Glow (외부 광원)
                    </button>
                    <!-- FLASH: 버튼 내부에서만 하얗게 번쩍임 -->
                    <button id="btn-flash"
                        class="btn-base w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold relative overflow-hidden shadow-lg shadow-cyan-100">
                        Flash (내부 섬광)
                        <div id="flash-overlay"
                            class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150">
                        </div>
                    </button>
                </div>
            </div>

            <!-- Category 3: Interactive Physics -->
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3 text-rose-600">
                    <div class="w-2 h-6 bg-rose-600 rounded-full"></div>
                    Interactive (상호작용)
                </h2>
                <div class="space-y-4">
                    <button id="btn-ripple"
                        class="ripple-btn w-full py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg shadow-orange-100">
                        Material Ripple (리플)
                    </button>
                    <button id="btn-particle"
                        class="btn-base w-full py-4 bg-pink-600 text-white rounded-2xl font-bold relative shadow-lg shadow-pink-100">
                        Particle Burst (파티클)
                    </button>
                    <div style="perspective: 1000px;">
                        <button id="btn-tilt"
                            class="btn-base w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-100">
                            3D Tilt (틸트 효과)
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="toast-container" class="fixed bottom-8 right-8 flex flex-col gap-2"></div>

    <script>
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl text-sm font-semibold animate-bounce border border-slate-700';
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        // 1. Rotation
        document.getElementById('btn-rotation').onclick = function () {
            this.style.transform = 'rotate(360deg)';
            setTimeout(() => this.style.transform = 'rotate(0deg)', 500);
        };

        // 2. Squash
        const btnSquash = document.getElementById('btn-squash');
        btnSquash.onclick = () => {
            btnSquash.classList.remove('animate-squash');
            void btnSquash.offsetWidth;
            btnSquash.classList.add('animate-squash');
        };

        // 3. Elevation
        const btnShadow = document.getElementById('btn-shadow');
        btnShadow.onmousedown = () => {
            btnShadow.style.transform = 'translateY(-8px)';
            btnShadow.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)';
        };
        btnShadow.onmouseup = btnShadow.onmouseleave = () => {
            btnShadow.style.transform = 'translateY(0)';
            btnShadow.style.boxShadow = 'none';
        };

        // 4. Neon Glow (외부광 강조)
        const btnGlow = document.getElementById('btn-glow');
        btnGlow.onclick = () => {
            btnGlow.classList.add('glow-active');
            showToast("버튼 외부로 보랏빛 네온이 번집니다!");
            setTimeout(() => btnGlow.classList.remove('glow-active'), 1000);
        };

        // 5. Flash (내부 섬광)
        const btnFlash = document.getElementById('btn-flash');
        const flashOverlay = document.getElementById('flash-overlay');
        btnFlash.onclick = () => {
            flashOverlay.style.opacity = '0.9';
            showToast("버튼 내부에서 강렬한 화이트 플래시!");
            setTimeout(() => flashOverlay.style.opacity = '0', 150);
        };

        // 6. Ripple
        const btnRipple = document.getElementById('btn-ripple');
        btnRipple.onclick = function (e) {
            const r = document.createElement('span');
            r.className = 'ripple';
            this.appendChild(r);
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            r.style.width = r.style.height = `${size}px`;
            r.style.left = `${e.clientX - rect.left - size / 2}px`;
            r.style.top = `${e.clientY - rect.top - size / 2}px`;
            setTimeout(() => r.remove(), 600);
        };

        // 7. Particle Burst (고대비 파티클)
        const btnParticle = document.getElementById('btn-particle');
        btnParticle.onclick = function (e) {
            const colors = ['#FFEB3B', '#76FF03', '#00E5FF', '#FFFFFF', '#FFD600'];
            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 6;
                p.style.width = p.style.height = `${size}px`;
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${e.clientX}px`;
                p.style.top = `${e.clientY}px`;
                p.style.boxShadow = '0 0 10px rgba(255,255,255,0.8)';
                document.body.appendChild(p);

                const tx = (Math.random() - 0.5) * 400;
                const ty = (Math.random() - 0.5) * 400;
                const anim = p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 1000, easing: 'cubic-bezier(0, .9, .57, 1)' });
                anim.onfinish = () => p.remove();
            }
        };

        // 8. 3D Tilt
        const btnTilt = document.getElementById('btn-tilt');
        btnTilt.onmousemove = (e) => {
            const rect = btnTilt.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width - 0.5) * 40;
            const y = ((e.clientY - rect.top) / rect.height - 0.5) * -40;
            btnTilt.style.transform = `rotateX(${y}deg) rotateY(${x}deg) scale(1.08)`;
        };
        btnTilt.onmouseleave = () => btnTilt.style.transform = 'rotateX(0) rotateY(0) scale(1)';

        window.onload = () => showToast("디자인 시스템 로드 완료!");
    </script>
</body>

</html>
