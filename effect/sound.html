<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Design Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .sound-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sound-card:hover {
            transform: translateY(-4px);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .sound-card:active {
            transform: scale(0.95);
        }

        .visualizer-bar {
            transition: height 0.05s ease;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .playing-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #38bdf8;
            border-radius: inherit;
            animation: pulse-ring 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            display: none;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-12 text-center">
        <h1
            class="text-4xl md:text-6xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            Sound Lab
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto">
            Tone.js를 이용한 실시간 합성 사운드 갤러리입니다. 버튼을 클릭하여 다양한 UI 및 게임 효과음을 감상해보세요.
        </p>

        <div id="start-overlay" class="mt-8">
            <button onclick="initAudio()"
                class="px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-full font-bold text-white shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center mx-auto gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                오디오 시작하기
            </button>
            <p class="text-xs text-slate-500 mt-2">브라우저 정책에 따라 첫 클릭 후 소리가 재생됩니다.</p>
        </div>
    </header>

    <section class="max-w-6xl mx-auto mb-12">
        <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500">Real-time Visualizer</h2>
                <div class="flex gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    <span class="text-xs text-slate-400">Live Feedback</span>
                </div>
            </div>
            <div id="visualizer-container" class="h-32 flex items-end justify-center gap-1">
                <!-- Bars will be generated via JS -->
            </div>
        </div>
    </section>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- UI Elements Group -->
        <div class="col-span-full mt-4 mb-2">
            <h3 class="text-xl font-bold text-slate-300">System UI & Feedback</h3>
        </div>

        <button onclick="playSound('pop')"
            class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left overflow-hidden">
            <div class="playing-indicator"></div>
            <div class="text-2xl mb-2">🫧</div>
            <div class="font-bold text-lg">Soft Pop</div>
            <div class="text-sm text-slate-400">풍선 터지는 듯한 가벼운 알림</div>
        </button>

        <button onclick="playSound('click')" class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left">
            <div class="text-2xl mb-2">🖱️</div>
            <div class="font-bold text-lg">Modern Click</div>
            <div class="text-sm text-slate-400">깔끔한 햅틱 피드백 스타일</div>
        </button>

        <button onclick="playSound('success')" class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left">
            <div class="text-2xl mb-2">✨</div>
            <div class="font-bold text-lg">Task Success</div>
            <div class="text-sm text-slate-400">긍정적인 완료 상태 알림</div>
        </button>

        <!-- Game Elements Group -->
        <div class="col-span-full mt-10 mb-2">
            <h3 class="text-xl font-bold text-slate-300">Retro Game SFX</h3>
        </div>

        <button onclick="playSound('jump')"
            class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left border-l-4 border-l-blue-500">
            <div class="text-2xl mb-2">🦘</div>
            <div class="font-bold text-lg">Classic Jump</div>
            <div class="text-sm text-slate-400">8비트 스타일의 도약 소리</div>
        </button>

        <button onclick="playSound('laser')"
            class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left border-l-4 border-l-red-500">
            <div class="text-2xl mb-2">🔫</div>
            <div class="font-bold text-lg">Laser Beam</div>
            <div class="text-sm text-slate-400">SFX 빔 발사 효과음</div>
        </button>

        <button onclick="playSound('levelup')"
            class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left border-l-4 border-l-yellow-500">
            <div class="text-2xl mb-2">🏆</div>
            <div class="font-bold text-lg">Power Up</div>
            <div class="text-sm text-slate-400">경험치 획득 및 레벨업 사운드</div>
        </button>

        <!-- Musical Group -->
        <div class="col-span-full mt-10 mb-2">
            <h3 class="text-xl font-bold text-slate-300">Atmospheric & Synth</h3>
        </div>

        <button onclick="playSound('bell')" class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left">
            <div class="text-2xl mb-2">🔔</div>
            <div class="font-bold text-lg">Zen Bell</div>
            <div class="text-sm text-slate-400">명상적인 메탈릭 벨 소리</div>
        </button>

        <button onclick="playSound('pad')" class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left">
            <div class="text-2xl mb-2">🌌</div>
            <div class="font-bold text-lg">Dreamy Pad</div>
            <div class="text-sm text-slate-400">부드럽게 퍼지는 공간감적 선율</div>
        </button>

        <button onclick="playSound('glitch')" class="sound-card relative p-6 rounded-2xl bg-slate-800/40 text-left">
            <div class="text-2xl mb-2">👾</div>
            <div class="font-bold text-lg">Digital Glitch</div>
            <div class="text-sm text-slate-400">데이터 처리 중 발생하는 노이즈</div>
        </button>
    </main>

    <footer class="max-w-6xl mx-auto mt-20 text-center text-slate-500 text-sm">
        <p>Built with Tone.js & Tailwind CSS. No external audio files were harmed.</p>
    </footer>

    <script>
        // Audio Engine Components
        let isInitialized = false;
        let analyzer;
        const synths = {};

        async function initAudio() {
            if (isInitialized) return;

            await Tone.start();
            console.log("Audio Context Started");

            // Visualizer Setup
            analyzer = new Tone.Analyser("fft", 32);
            Tone.getDestination().connect(analyzer);
            createVisualizerBars();
            requestAnimationFrame(drawVisualizer);

            // Create Synths
            synths.pop = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: "sine" }
            }).toDestination();

            synths.click = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
            }).toDestination();

            synths.basic = new Tone.Synth().toDestination();

            synths.metal = new Tone.MetalSynth({
                frequency: 200,
                envelope: { attack: 0.001, decay: 1, release: 0.1 },
                harmonicity: 5.1,
                modulationIndex: 32,
                resonance: 4000,
                octaves: 1.5
            }).toDestination();

            synths.pluck = new Tone.PluckSynth().toDestination();

            synths.fm = new Tone.FMSynth().toDestination();

            isInitialized = true;
            document.getElementById('start-overlay').style.opacity = '0.5';
            document.getElementById('start-overlay').style.pointerEvents = 'none';
            document.querySelector('#start-overlay button').innerText = '오디오 활성화됨';
        }

        function playSound(type) {
            if (!isInitialized) {
                alert("먼저 '오디오 시작하기' 버튼을 클릭해주세요.");
                return;
            }

            switch (type) {
                case 'pop':
                    synths.pop.triggerAttackRelease("C2", "16n");
                    break;
                case 'click':
                    synths.click.triggerAttackRelease("16n");
                    break;
                case 'success':
                    const now = Tone.now();
                    synths.basic.triggerAttackRelease("C4", "16n", now);
                    synths.basic.triggerAttackRelease("E4", "16n", now + 0.1);
                    synths.basic.triggerAttackRelease("G4", "16n", now + 0.2);
                    synths.basic.triggerAttackRelease("C5", "8n", now + 0.3);
                    break;
                case 'jump':
                    const jumpSynth = new Tone.MonoSynth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                    }).toDestination();
                    jumpSynth.triggerAttackRelease("C3", "16n");
                    jumpSynth.frequency.rampTo("C5", 0.15);
                    break;
                case 'laser':
                    const laserSynth = new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0, decay: 0.3, sustain: 0 }
                    }).toDestination();
                    laserSynth.triggerAttackRelease("G4", "8n");
                    laserSynth.frequency.rampTo("G2", 0.2);
                    break;
                case 'levelup':
                    const poly = new Tone.PolySynth().toDestination();
                    poly.triggerAttackRelease(["C4", "E4", "G4", "B4"], "4n");
                    break;
                case 'bell':
                    synths.metal.triggerAttackRelease("C4", "2n");
                    break;
                case 'pad':
                    const padSynth = new Tone.FMSynth({
                        modulationIndex: 12,
                        envelope: { attack: 0.5, decay: 0.5, sustain: 1, release: 1 }
                    }).toDestination();
                    padSynth.triggerAttackRelease("F3", "2n");
                    break;
                case 'glitch':
                    const glitch = new Tone.NoiseSynth({
                        noise: { type: "pink" },
                        envelope: { attack: 0.001, decay: 0.1, sustain: 0 }
                    }).toDestination();
                    for (let i = 0; i < 5; i++) {
                        glitch.triggerAttackRelease("32n", Tone.now() + (i * 0.05));
                    }
                    break;
            }
        }

        function createVisualizerBars() {
            const container = document.getElementById('visualizer-container');
            container.innerHTML = '';
            for (let i = 0; i < 32; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar w-full bg-gradient-to-t from-blue-600 to-emerald-400 rounded-t-sm';
                bar.style.height = '4px';
                container.appendChild(bar);
            }
        }

        function drawVisualizer() {
            if (!analyzer) return;
            const values = analyzer.getValue();
            const bars = document.querySelectorAll('.visualizer-bar');

            bars.forEach((bar, i) => {
                // Convert decibels to height (approximate)
                const val = values[i];
                const height = Math.max(4, (val + 100) * 1.2);
                bar.style.height = `${height}%`;
                bar.style.opacity = height > 5 ? '1' : '0.3';
            });

            requestAnimationFrame(drawVisualizer);
        }
    </script>
</body>

</html>
