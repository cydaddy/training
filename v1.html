<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>구구단 나눗셈 배틀</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f1c40f;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 설정 화면 */
        #setup-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 100;
        }

        .setup-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .setup-box h1 { font-size: 3rem; margin-bottom: 30px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        .btn-group { margin: 20px 0; }
        .btn-group label { display: block; margin-bottom: 10px; font-size: 1.2rem; }
        
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn-mode { background: var(--primary); color: white; }
        .btn-split { background: var(--warning); color: var(--dark); }
        .btn-start { background: var(--success); color: white; width: 100%; margin-top: 20px; font-size: 1.5rem; }
        
        button:active { transform: scale(0.95); }
        button.selected { outline: 4px solid white; transform: scale(1.05); }

        /* 게임 화면 */
        #game-area {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .player-column {
            flex: 1;
            height: 100%;
            border-right: 2px solid rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255,255,255,0.05);
            transition: all 0.5s;
        }

        .player-header {
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            background: rgba(0,0,0,0.3);
        }

        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .problem {
            font-size: 4.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .answer-display {
            font-size: 5rem;
            height: 100px;
            min-width: 120px;
            background: rgba(255,255,255,0.2);
            border-bottom: 5px solid white;
            text-align: center;
            margin-bottom: 30px;
        }

        /* 숫자 패드 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        .key {
            height: 80px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--dark);
            cursor: pointer;
            user-select: none;
        }

        .key:active { background: var(--primary); color: white; }
        .key.clear { background: var(--error); color: white; }
        .key.enter { background: var(--success); color: white; }

        /* 결과 화면 */
        #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 200;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            width: 80%;
            max-width: 600px;
            padding: 15px 30px;
            margin: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            font-size: 1.5rem;
        }

        .winner { border: 3px solid var(--warning); background: rgba(241, 196, 15, 0.2); }

        /* 효과 */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 999;
        }

        .finished-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--warning);
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="setup-box">
        <h1>🔢 나눗셈 배틀 퀴즈</h1>
        
        <div class="btn-group">
            <label>모드 선택</label>
            <button class="btn-mode selected" onclick="setMode('practice', this)">연습 모드</button>
            <button class="btn-mode" onclick="setMode('game', this)">게임 모드</button>
        </div>

        <div class="btn-group">
            <label>인원 설정 (분할)</label>
            <button class="btn-split selected" onclick="setSplit(1, this)">1명</button>
            <button class="btn-split" onclick="setSplit(2, this)">2명</button>
            <button class="btn-split" onclick="setSplit(3, this)">3명</button>
            <button class="btn-split" onclick="setSplit(4, this)">4명</button>
            <button class="btn-split" onclick="setSplit(5, this)">5명</button>
            <button class="btn-split" onclick="setSplit(6, this)">6명</button>
        </div>

        <div class="btn-group">
            <label>문제 수</label>
            <input type="number" id="quiz-count" value="10" min="1" max="50" style="padding:10px; font-size:1.2rem; border-radius:5px; width:100px; text-align:center;">
        </div>

        <button class="btn-start" onclick="startGame()">학습 시작!</button>
    </div>
</div>

<div id="game-area"></div>

<div id="result-screen">
    <h1 style="font-size: 4rem; color: var(--warning);">RESULT</h1>
    <div id="rank-list"></div>
    <button class="btn-start" style="width: auto; padding: 15px 50px;" onclick="location.reload()">처음으로</button>
</div>

<script>
    let mode = 'practice';
    let splitCount = 1;
    let quizLimit = 10;
    let players = [];

    // 오디오 컨텍스트 설정 (효과음)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function soundCorrect() {
        playSound(523.25, 'sine', 0.2);
        setTimeout(() => playSound(659.25, 'sine', 0.2), 100);
    }

    function soundError() {
        playSound(110, 'sawtooth', 0.3);
    }

    function setMode(m, btn) {
        mode = m;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function setSplit(s, btn) {
        splitCount = s;
        document.querySelectorAll('.btn-split').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function startGame() {
        quizLimit = parseInt(document.getElementById('quiz-count').value);
        document.getElementById('setup-screen').style.display = 'none';
        const gameArea = document.getElementById('game-area');
        gameArea.innerHTML = '';

        for (let i = 0; i < splitCount; i++) {
            const player = {
                id: i + 1,
                correct: 0,
                wrong: 0,
                currentQuiz: 0,
                targetAnswer: 0,
                inputAnswer: '',
                startTime: Date.now(),
                endTime: null,
                isFinished: false
            };
            players.push(player);
            createPlayerUI(player);
            nextProblem(player);
        }
    }

    function createPlayerUI(player) {
        const col = document.createElement('div');
        col.className = 'player-column';
        col.id = `player-${player.id}`;
        col.innerHTML = `
            <div class="player-header">학생 ${player.id} (<span class="count">0</span>/${quizLimit})</div>
            <div class="quiz-container">
                <div class="problem" id="prob-${player.id}">? ÷ ?</div>
                <div class="answer-display" id="ans-${player.id}"></div>
            </div>
            <div class="keypad">
                ${[1,2,3,4,5,6,7,8,9,0].map(n => `<div class="key" onclick="pressKey(${player.id}, '${n}')">${n}</div>`).join('')}
                <div class="key clear" onclick="pressKey(${player.id}, 'C')">C</div>
                <div class="key enter" onclick="pressKey(${player.id}, 'E')">입력</div>
            </div>
        `;
        document.getElementById('game-area').appendChild(col);
    }

    function nextProblem(player) {
        if (player.currentQuiz >= quizLimit) {
            finishPlayer(player);
            return;
        }

        // 구구단 기반 나눗셈 생성 (1~9단)
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 9) + 1;
        const c = a * b; // c / a = b

        player.targetAnswer = b;
        document.getElementById(`prob-${player.id}`).innerText = `${c} ÷ ${a} = ?`;
        document.getElementById(`ans-${player.id}`).innerText = '';
        player.inputAnswer = '';
    }

    function pressKey(pid, key) {
        const player = players[pid - 1];
        if (player.isFinished) return;

        const display = document.getElementById(`ans-${player.id}`);

        if (key === 'C') {
            player.inputAnswer = '';
        } else if (key === 'E') {
            checkAnswer(player);
        } else {
            if (player.inputAnswer.length < 2) {
                player.inputAnswer += key;
            }
        }
        display.innerText = player.inputAnswer;
        
        // 터치 효과
        createParticles(event.clientX, event.clientY, '#ffffff');
    }

    function checkAnswer(player) {
        const isCorrect = parseInt(player.inputAnswer) === player.targetAnswer;
        const col = document.getElementById(`player-${player.id}`);

        if (isCorrect) {
            player.correct++;
            soundCorrect();
            triggerFlash(col, 'rgba(46, 204, 113, 0.5)');
            // 파티클
            const rect = col.getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2, '#2ecc71', 30);
        } else {
            player.wrong++;
            soundError();
            triggerFlash(col, 'rgba(231, 76, 60, 0.5)');
        }

        player.currentQuiz++;
        col.querySelector('.count').innerText = player.currentQuiz;
        nextProblem(player);
    }

    function triggerFlash(el, color) {
        const originalBg = el.style.background;
        el.style.background = color;
        setTimeout(() => {
            el.style.background = originalBg;
        }, 200);
    }

    function finishPlayer(player) {
        player.isFinished = true;
        player.endTime = Date.now();
        const col = document.getElementById(`player-${player.id}`);
        const overlay = document.createElement('div');
        overlay.className = 'finished-overlay';
        overlay.innerText = 'WAITING...';
        col.appendChild(overlay);

        // 모든 플레이어 종료 체크
        if (players.every(p => p.isFinished)) {
            showResults();
        }
    }

    function showResults() {
        const resultScreen = document.getElementById('result-screen');
        const rankList = document.getElementById('rank-list');
        resultScreen.style.display = 'flex';
        rankList.innerHTML = '';

        // 정렬 기준: 1.맞은 개수(내림차순) 2.걸린 시간(오름차순)
        const sorted = [...players].sort((a, b) => {
            if (b.correct !== a.correct) return b.correct - a.correct;
            return (a.endTime - a.startTime) - (b.endTime - b.startTime);
        });

        sorted.forEach((p, index) => {
            const timeTaken = ((p.endTime - p.startTime) / 1000).toFixed(2);
            const div = document.createElement('div');
            div.className = `rank-item ${index === 0 && mode === 'game' ? 'winner' : ''}`;
            div.innerHTML = `
                <span>${index + 1}위: 학생 ${p.id}</span>
                <span>정답: ${p.correct} / 오답: ${p.wrong}</span>
                <span>${timeTaken}초</span>
            `;
            rankList.appendChild(div);
        });
    }

    // 파티클 시스템
    function createParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.width = Math.random() * 10 + 5 + 'px';
            p.style.height = p.style.width;
            p.style.background = color;
            p.style.borderRadius = '50%';
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 10 + 5;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            
            document.body.appendChild(p);
            
            let opacity = 1;
            const anim = setInterval(() => {
                p.style.left = parseFloat(p.style.left) + vx + 'px';
                p.style.top = parseFloat(p.style.top) + vy + 'px';
                opacity -= 0.05;
                p.style.opacity = opacity;
                if (opacity <= 0) {
                    clearInterval(anim);
                    p.remove();
                }
            }, 20);
        }
    }
</script>

</body>
</html>
