<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 금문교 (Golden Gate Bridge) Viewer</title>
    <meta name="description" content="Three.js를 활용한 3D 금문교 조망 프로그램">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: #0a0a1a;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        canvas { display: block; }

        .title-bar {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            text-align: center; pointer-events: none; z-index: 20;
        }
        .title-bar h1 {
            font-size: 28px; font-weight: 700; color: #fff;
            text-shadow: 0 2px 20px rgba(0,0,0,0.6); letter-spacing: 2px;
        }
        .title-bar p {
            font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 4px;
            font-weight: 300; text-shadow: 0 1px 10px rgba(0,0,0,0.5);
        }

        .controls-panel {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20; flex-wrap: wrap; justify-content: center;
        }
        .ctrl-btn {
            padding: 10px 20px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 400;
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.5px;
        }
        .ctrl-btn:hover {
            background: rgba(255, 82, 50, 0.3); border-color: rgba(255, 82, 50, 0.5);
            transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255, 82, 50, 0.2);
        }
        .ctrl-btn.active {
            background: rgba(255, 82, 50, 0.4); border-color: rgba(255, 82, 50, 0.6);
        }

        .info-panel {
            position: fixed; top: 24px; right: 24px; width: 260px; padding: 20px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; z-index: 20;
        }
        .info-panel h3 {
            font-size: 15px; font-weight: 600; color: #ff5232;
            margin-bottom: 12px; letter-spacing: 0.5px;
        }
        .info-panel .info-item {
            display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px;
        }
        .info-item .label { color: rgba(255,255,255,0.5); }
        .info-item .value { color: rgba(255,255,255,0.9); font-weight: 400; }

        .time-indicator {
            position: fixed; top: 24px; left: 24px; padding: 10px 16px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; z-index: 20;
        }
        .time-indicator .time-label {
            font-size: 11px; color: rgba(255,255,255,0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .time-indicator .time-value {
            font-size: 18px; font-weight: 600; color: #fff; margin-top: 2px;
        }

        .instructions {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            text-align: center; pointer-events: none; z-index: 20;
            opacity: 0.6; transition: opacity 2s ease;
        }
        .instructions p { font-size: 12px; color: rgba(255,255,255,0.6); }
        .instructions.hidden { opacity: 0; }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a1a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            transition: opacity 1s ease;
        }
        .loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,82,50,0.2); border-top-color: #ff5232;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .loading-text { margin-top: 20px; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 300; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">금문교를 건설하는 중...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="title-bar">
        <h1>🌉 금문교 3D</h1>
        <p>Golden Gate Bridge — San Francisco, California</p>
    </div>

    <div class="time-indicator" id="timeIndicator">
        <div class="time-label">시간대</div>
        <div class="time-value" id="timeValue">일몰</div>
    </div>

    <div class="info-panel">
        <h3>📐 금문교 정보</h3>
        <div class="info-item"><span class="label">총 길이</span><span class="value">2,737 m</span></div>
        <div class="info-item"><span class="label">주 경간</span><span class="value">1,280 m</span></div>
        <div class="info-item"><span class="label">탑 높이</span><span class="value">227 m</span></div>
        <div class="info-item"><span class="label">개통</span><span class="value">1937년 5월 27일</span></div>
        <div class="info-item"><span class="label">차선</span><span class="value">6차선</span></div>
        <div class="info-item"><span class="label">색상</span><span class="value">International Orange</span></div>
    </div>

    <div class="instructions" id="instructions">
        <p>🖱️ 마우스 드래그: 회전 | 스크롤: 줌 | 우클릭 드래그: 이동</p>
    </div>

    <div class="controls-panel">
        <button class="ctrl-btn" id="btnFront" onclick="setCameraPreset('front')">정면</button>
        <button class="ctrl-btn" id="btnSide" onclick="setCameraPreset('side')">측면</button>
        <button class="ctrl-btn" id="btnTop" onclick="setCameraPreset('top')">상공</button>
        <button class="ctrl-btn" id="btnUnder" onclick="setCameraPreset('under')">하부</button>
        <button class="ctrl-btn" id="btnCinematic" onclick="setCameraPreset('cinematic')">시네마틱</button>
        <button class="ctrl-btn" id="btnAutoRotate" onclick="toggleAutoRotate()">자동 회전</button>
        <button class="ctrl-btn" id="btnTime" onclick="cycleTime()">시간 변경</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // Globals
        // ============================================
        let scene, camera, renderer, controls;
        let water, bridgeGroup;
        let autoRotate = false;
        let timeIndex = 0;
        const clock = new THREE.Clock();
        let ambientLight, dirLight, dirLight2;
        let bridgeLights = [];
        let clouds = [];

        const timePresets = [
            { name: '일몰', sky: [0.95, 0.4, 0.2], fog: [0.85, 0.35, 0.2], ambient: 0.4, dirColor: [1.0, 0.7, 0.4], dirIntensity: 1.2 },
            { name: '낮', sky: [0.53, 0.81, 0.98], fog: [0.6, 0.75, 0.88], ambient: 0.7, dirColor: [1.0, 1.0, 0.95], dirIntensity: 1.0 },
            { name: '밤', sky: [0.02, 0.02, 0.08], fog: [0.03, 0.03, 0.1], ambient: 0.15, dirColor: [0.3, 0.35, 0.6], dirIntensity: 0.3 },
            { name: '새벽', sky: [0.3, 0.2, 0.5], fog: [0.35, 0.25, 0.45], ambient: 0.3, dirColor: [0.8, 0.5, 0.7], dirIntensity: 0.6 },
            { name: '안개', sky: [0.75, 0.75, 0.78], fog: [0.7, 0.72, 0.75], ambient: 0.6, dirColor: [0.9, 0.9, 0.9], dirIntensity: 0.4 }
        ];

        // Export functions to window for onclick handlers
        window.setCameraPreset = setCameraPreset;
        window.toggleAutoRotate = toggleAutoRotate;
        window.cycleTime = cycleTime;

        init();

        function init() {
            try {
                // Scene
                scene = new THREE.Scene();

                // Camera
                camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
                camera.position.set(80, 40, 120);

                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                document.getElementById('canvas-container').appendChild(renderer.domElement);

                // Controls
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.maxPolarAngle = Math.PI / 2 + 0.1;
                controls.minDistance = 20;
                controls.maxDistance = 500;
                controls.target.set(0, 15, 0);

                // Apply initial time preset
                applyTimePreset(timePresets[0]);

                // Lights
                setupLights();

                // Build the bridge
                buildGoldenGateBridge();

                // Environment
                createWater();
                createTerrain();
                createClouds();

                // Resize
                window.addEventListener('resize', onResize);

                // Start animation loop
                animate();

                // Hide loading after build
                setTimeout(() => {
                    document.getElementById('loading').classList.add('fade-out');
                }, 800);

                // Hide instructions after 6s
                setTimeout(() => {
                    document.getElementById('instructions').classList.add('hidden');
                }, 6000);

            } catch (err) {
                console.error('Init error:', err);
                document.getElementById('loading').innerHTML = '<div style="color:red;text-align:center;">오류 발생: ' + err.message + '</div>';
            }
        }

        // ============================================
        // Lights
        // ============================================
        function setupLights() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(100, 80, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 500;
            dirLight.shadow.camera.left = -150;
            dirLight.shadow.camera.right = 150;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -50;
            scene.add(dirLight);

            dirLight2 = new THREE.DirectionalLight(0x4488cc, 0.3);
            dirLight2.position.set(-50, 40, -30);
            scene.add(dirLight2);

            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x444444, 0.3);
            scene.add(hemiLight);
        }

        // ============================================
        // Golden Gate Bridge
        // ============================================
        function buildGoldenGateBridge() {
            bridgeGroup = new THREE.Group();

            const orangeMat = new THREE.MeshStandardMaterial({ color: 0xC0362C, roughness: 0.6, metalness: 0.3 });
            const darkOrangeMat = new THREE.MeshStandardMaterial({ color: 0x8B2500, roughness: 0.7, metalness: 0.2 });
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9, metalness: 0.1 });
            const cableMat = new THREE.MeshStandardMaterial({ color: 0xC0362C, roughness: 0.5, metalness: 0.4 });

            const towerHeight = 70;
            const deckLength = 200;
            const deckWidth = 16;
            const deckHeight = 2;
            const deckY = 20;
            const towerSpacing = 100;

            // ---- TOWERS ----
            for (let side = -1; side <= 1; side += 2) {
                createTower(side * towerSpacing / 2, 0, 0, towerHeight, 4, 6, orangeMat, darkOrangeMat);
            }

            // ---- ROAD DECK ----
            const deck = new THREE.Mesh(new THREE.BoxGeometry(deckLength, deckHeight, deckWidth), roadMat);
            deck.position.set(0, deckY, 0);
            deck.castShadow = true;
            deck.receiveShadow = true;
            bridgeGroup.add(deck);

            // Deck trusses
            for (let x = -deckLength / 2 + 2; x <= deckLength / 2 - 2; x += 4) {
                const truss = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3, deckWidth - 1), orangeMat);
                truss.position.set(x, deckY - 2.5, 0);
                bridgeGroup.add(truss);
            }

            // Bottom horizontal truss
            const btmTruss = new THREE.Mesh(new THREE.BoxGeometry(deckLength, 0.5, deckWidth - 1), orangeMat);
            btmTruss.position.set(0, deckY - 4, 0);
            bridgeGroup.add(btmTruss);

            // Side rails
            const laneMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            for (let z = -1; z <= 1; z += 2) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(deckLength, 3, 0.3), orangeMat);
                rail.position.set(0, deckY + 2.5, z * deckWidth / 2);
                bridgeGroup.add(rail);

                for (let x = -deckLength / 2 + 1; x <= deckLength / 2 - 1; x += 2) {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3, 0.15), orangeMat);
                    post.position.set(x, deckY + 2.5, z * deckWidth / 2);
                    bridgeGroup.add(post);
                }
            }

            // Lane markings
            for (let i = -2; i <= 2; i++) {
                if (i === 0) continue;
                for (let x = -deckLength / 2 + 2; x < deckLength / 2 - 2; x += 4) {
                    const line = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 0.15), laneMat);
                    line.position.set(x, deckY + 1.03, i * 2.5);
                    bridgeGroup.add(line);
                }
            }

            // ---- MAIN CABLES ----
            for (let z = -1; z <= 1; z += 2) {
                createMainCable(z * (deckWidth / 2 - 0.5), towerHeight, deckY + 4, towerSpacing, deckLength, cableMat);
            }

            // ---- SUSPENDER CABLES ----
            for (let z = -1; z <= 1; z += 2) {
                createSuspenderCables(z * (deckWidth / 2 - 0.5), towerHeight, deckY + 1, towerSpacing, deckLength, cableMat);
            }

            // ---- APPROACH SPANS ----
            for (let side = -1; side <= 1; side += 2) {
                const approachLen = 25;
                const approach = new THREE.Mesh(new THREE.BoxGeometry(approachLen, deckHeight, deckWidth), roadMat);
                approach.position.set(side * (deckLength / 2 + approachLen / 2), deckY, 0);
                approach.castShadow = true;
                bridgeGroup.add(approach);

                for (let p = 0; p < 3; p++) {
                    const pillar = new THREE.Mesh(new THREE.BoxGeometry(3, deckY + 5, 3), orangeMat);
                    pillar.position.set(side * (towerSpacing / 2 + 8 + p * 10), (deckY + 5) / 2 - 5, 0);
                    pillar.castShadow = true;
                    bridgeGroup.add(pillar);
                }
            }

            scene.add(bridgeGroup);
        }

        function createTower(x, y, z, height, width, depth, mainMat, darkMat) {
            const legSpacing = depth * 1.4;

            for (let lz = -1; lz <= 1; lz += 2) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth / 2), mainMat);
                leg.position.set(x, y + height / 2, lz * legSpacing / 2);
                leg.castShadow = true;
                leg.receiveShadow = true;
                bridgeGroup.add(leg);

                const top = new THREE.Mesh(new THREE.BoxGeometry(width * 0.85, 10, depth / 2 * 0.85), mainMat);
                top.position.set(x, y + height - 2, lz * legSpacing / 2);
                bridgeGroup.add(top);
            }

            const crossPositions = [22, 35, 50, height - 5];
            crossPositions.forEach(cy => {
                const cross = new THREE.Mesh(new THREE.BoxGeometry(width * 0.7, 3, legSpacing + depth / 2), darkMat);
                cross.position.set(x, y + cy, 0);
                cross.castShadow = true;
                bridgeGroup.add(cross);
            });

            const arch = new THREE.Mesh(new THREE.BoxGeometry(width * 0.6, 5, legSpacing * 0.5), mainMat);
            arch.position.set(x, y + height + 2, 0);
            bridgeGroup.add(arch);

            const base = new THREE.Mesh(new THREE.BoxGeometry(width + 4, 8, legSpacing + depth + 4), darkMat);
            base.position.set(x, y, 0);
            base.castShadow = true;
            base.receiveShadow = true;
            bridgeGroup.add(base);
        }

        function createMainCable(zPos, towerTop, deckTop, towerSpacing, deckLen, mat) {
            const points = [];
            const segments = 100;
            const halfSpan = towerSpacing / 2;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = (t - 0.5) * deckLen;
                const relX = Math.abs(x);
                let y;

                if (relX <= halfSpan) {
                    const normalizedX = x / halfSpan;
                    const sag = 25;
                    y = towerTop - sag * (1 - normalizedX * normalizedX);
                } else {
                    const extra = (relX - halfSpan) / (deckLen / 2 - halfSpan);
                    y = towerTop - extra * (towerTop - deckTop - 3);
                }

                points.push(new THREE.Vector3(x, y, zPos));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const cable = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.4, 8, false), mat);
            cable.castShadow = true;
            bridgeGroup.add(cable);
        }

        function createSuspenderCables(zPos, towerTop, deckTop, towerSpacing, deckLen, mat) {
            const halfSpan = towerSpacing / 2;
            for (let x = -halfSpan + 3; x <= halfSpan - 3; x += 3) {
                const normalizedX = x / halfSpan;
                const sag = 25;
                const cableY = towerTop - sag * (1 - normalizedX * normalizedX);
                const length = cableY - deckTop;
                if (length > 0.5) {
                    const susp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, length, 4), mat);
                    susp.position.set(x, deckTop + length / 2, zPos);
                    bridgeGroup.add(susp);
                }
            }
        }

        // ============================================
        // Water
        // ============================================
        function createWater() {
            const waterGeo = new THREE.PlaneGeometry(2000, 2000, 128, 128);
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x1a4c6e, roughness: 0.2, metalness: 0.6,
                transparent: true, opacity: 0.85,
            });
            water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -4;
            water.receiveShadow = true;
            water.userData.originalPositions = waterGeo.attributes.position.array.slice();
            scene.add(water);
        }

        // ============================================
        // Terrain
        // ============================================
        function createTerrain() {
            const terrainMat = new THREE.MeshStandardMaterial({ color: 0x2d5016, roughness: 0.9, flatShading: true });
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b5b3f, roughness: 0.95, flatShading: true });

            // North hills
            for (let i = 0; i < 5; i++) {
                const sz = 30 + Math.random() * 60;
                const h = 20 + Math.random() * 40;
                const hill = new THREE.Mesh(
                    new THREE.ConeGeometry(sz, h, 6 + Math.floor(Math.random() * 4)),
                    i < 3 ? terrainMat : rockMat
                );
                hill.position.set(-130 - i * 20 + Math.random() * 20, -4 + h / 2 - 10, -60 + Math.random() * 120);
                hill.castShadow = true;
                hill.receiveShadow = true;
                scene.add(hill);
            }

            // South hills
            for (let i = 0; i < 5; i++) {
                const sz = 25 + Math.random() * 50;
                const h = 15 + Math.random() * 30;
                const hill = new THREE.Mesh(
                    new THREE.ConeGeometry(sz, h, 6 + Math.floor(Math.random() * 4)),
                    i < 3 ? terrainMat : rockMat
                );
                hill.position.set(130 + i * 18 + Math.random() * 15, -4 + h / 2 - 10, -50 + Math.random() * 100);
                hill.castShadow = true;
                hill.receiveShadow = true;
                scene.add(hill);
            }

            // Ground planes
            const groundGeo = new THREE.PlaneGeometry(200, 400);
            const gN = new THREE.Mesh(groundGeo, terrainMat);
            gN.rotation.x = -Math.PI / 2; gN.position.set(-200, -3, 0); gN.receiveShadow = true;
            scene.add(gN);
            const gS = new THREE.Mesh(groundGeo.clone(), terrainMat);
            gS.rotation.x = -Math.PI / 2; gS.position.set(200, -3, 0); gS.receiveShadow = true;
            scene.add(gS);
        }

        // ============================================
        // Clouds
        // ============================================
        function createClouds() {
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 1.0 });
            for (let i = 0; i < 25; i++) {
                const cloud = new THREE.Group();
                const numBlobs = 3 + Math.floor(Math.random() * 4);
                for (let j = 0; j < numBlobs; j++) {
                    const blob = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random() * 6, 8, 6), cloudMat);
                    blob.position.set(Math.random() * 10 - 5, Math.random() * 3, Math.random() * 6 - 3);
                    blob.scale.y = 0.4 + Math.random() * 0.3;
                    cloud.add(blob);
                }
                cloud.position.set(Math.random() * 600 - 300, 60 + Math.random() * 80, Math.random() * 400 - 200);
                cloud.userData.speed = 0.02 + Math.random() * 0.05;
                clouds.push(cloud);
                scene.add(cloud);
            }
        }

        // ============================================
        // Bridge Lights (night mode)
        // ============================================
        function createBridgeLights() {
            bridgeLights.forEach(l => {
                if (l.parent) l.parent.remove(l);
            });
            bridgeLights = [];

            if (timeIndex === 2 || timeIndex === 3) {
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });
                for (let x = -95; x <= 95; x += 10) {
                    const light = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), lightMat);
                    light.position.set(x, 24, 0);
                    bridgeGroup.add(light);
                    bridgeLights.push(light);

                    if (x % 30 === 0) {
                        const pLight = new THREE.PointLight(0xffcc44, 0.5, 30);
                        pLight.position.set(x, 24, 0);
                        bridgeGroup.add(pLight);
                        bridgeLights.push(pLight);
                    }
                }

                for (let side = -1; side <= 1; side += 2) {
                    const topLight = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3333 }));
                    topLight.position.set(side * 50, 73, 0);
                    bridgeGroup.add(topLight);
                    bridgeLights.push(topLight);

                    const tpLight = new THREE.PointLight(0xff3333, 1, 40);
                    tpLight.position.set(side * 50, 73, 0);
                    bridgeGroup.add(tpLight);
                    bridgeLights.push(tpLight);
                }
            }
        }

        // ============================================
        // Time Presets
        // ============================================
        function applyTimePreset(preset) {
            const skyColor = new THREE.Color(...preset.sky);
            const fogColor = new THREE.Color(...preset.fog);
            scene.background = skyColor;
            scene.fog = new THREE.FogExp2(fogColor, 0.003);

            if (ambientLight) ambientLight.intensity = preset.ambient;
            if (dirLight) {
                dirLight.color.setRGB(...preset.dirColor);
                dirLight.intensity = preset.dirIntensity;
            }

            if (water) {
                const waterColors = { '밤': 0x0a1a2e, '일몰': 0x2a3c5e, '안개': 0x4a6a7e };
                water.material.color.setHex(waterColors[preset.name] || 0x1a4c6e);
            }

            document.getElementById('timeValue').textContent = preset.name;
            createBridgeLights();
        }

        function cycleTime() {
            timeIndex = (timeIndex + 1) % timePresets.length;
            applyTimePreset(timePresets[timeIndex]);
        }

        // ============================================
        // Camera Presets
        // ============================================
        function setCameraPreset(name) {
            const presets = {
                front:     { pos: [0, 30, 80],     target: [0, 20, 0] },
                side:      { pos: [140, 35, 20],   target: [0, 20, 0] },
                top:       { pos: [0, 150, 50],    target: [0, 0, 0] },
                under:     { pos: [10, 5, 15],     target: [0, 18, 0] },
                cinematic: { pos: [-60, 15, 90],   target: [20, 25, 0] },
            };
            const p = presets[name];
            if (p) animateCamera({ x: p.pos[0], y: p.pos[1], z: p.pos[2] }, { x: p.target[0], y: p.target[1], z: p.target[2] });
        }

        function animateCamera(targetPos, lookAtTarget) {
            const startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
            const startTarget = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
            const duration = 1500;
            const startTime = performance.now();

            function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

            function update() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const e = easeInOutCubic(progress);

                camera.position.x = startPos.x + (targetPos.x - startPos.x) * e;
                camera.position.y = startPos.y + (targetPos.y - startPos.y) * e;
                camera.position.z = startPos.z + (targetPos.z - startPos.z) * e;

                controls.target.x = startTarget.x + (lookAtTarget.x - startTarget.x) * e;
                controls.target.y = startTarget.y + (lookAtTarget.y - startTarget.y) * e;
                controls.target.z = startTarget.z + (lookAtTarget.z - startTarget.z) * e;

                if (progress < 1) requestAnimationFrame(update);
            }
            update();
        }

        // ============================================
        // Auto Rotate
        // ============================================
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.5;
            document.getElementById('btnAutoRotate').classList.toggle('active', autoRotate);
        }

        // ============================================
        // Animation Loop
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Wave animation
            if (water && water.geometry) {
                const positions = water.geometry.attributes.position.array;
                const original = water.userData.originalPositions;
                const vCount = positions.length / 3;
                for (let i = 0; i < vCount; i++) {
                    const ox = original[i * 3];
                    const oy = original[i * 3 + 1];
                    positions[i * 3 + 2] =
                        Math.sin(ox * 0.05 + time * 0.8) * 0.8 +
                        Math.cos(oy * 0.03 + time * 0.6) * 0.5 +
                        Math.sin((ox + oy) * 0.02 + time * 1.2) * 0.3;
                }
                water.geometry.attributes.position.needsUpdate = true;
            }

            // Cloud drift
            clouds.forEach(c => {
                c.position.x += c.userData.speed;
                if (c.position.x > 350) c.position.x = -350;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================
        // Resize
        // ============================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
