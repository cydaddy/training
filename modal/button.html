<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝업 vs 모달 비교 체험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
        }

        /* 팝업 제어를 위한 전용 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* 애니메이션 효과 */
        @keyframes modal-pop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-modal {
            animation: modal-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 가상 시스템 팝업 (OS 기본 느낌) */
        .system-style {
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #ccc;
            width: 320px;
            padding: 20px;
            font-family: sans-serif;
            /* 일부러 투박하게 설정 */
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900">

    <header class="bg-white border-b border-gray-200 py-10 px-4 mb-8">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">똑같은 내용, 다른 느낌!</h1>
            <p class="text-gray-500 text-lg italic">"디자인이 아이들의 마음에 닿는 온도를 바꿉니다."</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

            <!-- 왼쪽: 시스템 팝업 카드 -->
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-200 flex flex-col items-center">
                <div
                    class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mb-6 text-2xl text-gray-400">
                    💻</div>
                <h2 class="text-xl font-bold mb-4">기본 시스템 팝업</h2>
                <p class="text-gray-500 text-sm text-center mb-8">브라우저가 제공하는 표준 방식입니다.<br>빠르지만 기계적인 느낌을 줍니다.</p>
                <button onclick="toggleSystem(true)"
                    class="w-full py-4 bg-gray-700 text-white rounded-2xl font-bold hover:bg-gray-800 transition-all active:scale-95">
                    팝업 띄우기
                </button>
            </div>

            <!-- 오른쪽: 커스텀 모달 카드 -->
            <div
                class="bg-white rounded-3xl p-8 shadow-md border-2 border-indigo-100 flex flex-col items-center transform hover:-translate-y-1 transition-transform">
                <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mb-6 text-3xl">✨</div>
                <h2 class="text-xl font-bold text-indigo-900 mb-4">예쁜 커스텀 모달</h2>
                <p class="text-gray-500 text-sm text-center mb-8">선생님이 직접 디자인한 창입니다.<br>칭찬의 기쁨이 훨씬 잘 전달됩니다.</p>
                <button onclick="toggleCustom(true)"
                    class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all active:scale-95">
                    모달 띄우기
                </button>
            </div>

        </div>

        <!-- 결과 알림창 -->
        <div id="resultBox"
            class="hidden mt-10 p-5 bg-white border border-gray-200 rounded-2xl text-center animate-modal">
            <p id="resultText" class="text-gray-700 font-medium"></p>
        </div>
    </main>

    <!-- [1] 가상 시스템 팝업 오버레이 -->
    <div id="systemOverlay" class="modal-overlay bg-black/10">
        <div class="system-style">
            <h4 class="text-sm font-bold mb-2">웹 페이지 메시지</h4>
            <p class="text-sm text-gray-700 mb-8">김철수 학생에게 칭찬 스티커를 보낼까요?</p>
            <div class="flex justify-end gap-2">
                <button onclick="handleResponse('system', false)"
                    class="px-5 py-1.5 border border-gray-300 text-sm rounded bg-gray-50 hover:bg-gray-100">취소</button>
                <button onclick="handleResponse('system', true)"
                    class="px-5 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">보내기</button>
            </div>
        </div>
    </div>

    <!-- [2] 예쁜 커스텀 모달 오버레이 -->
    <div id="customOverlay" class="modal-overlay bg-indigo-900/40 backdrop-blur-sm">
        <div class="bg-white w-[380px] rounded-[40px] p-10 text-center shadow-2xl animate-modal relative">
            <!-- 장식 요소 -->
            <div
                class="absolute -top-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-yellow-400 rounded-full flex items-center justify-center text-3xl shadow-lg border-4 border-white">
                ⭐</div>

            <h3 class="text-2xl font-bold text-gray-800 mb-4 mt-4">칭찬을 보낼까요?</h3>
            <p class="text-gray-500 leading-relaxed mb-10 text-lg">
                <span class="font-bold text-indigo-600 underline">김철수</span> 학생에게<br>
                따뜻한 응원을 가득 담은<br>
                칭찬 스티커가 배달됩니다.
            </p>

            <div class="flex flex-col gap-3">
                <button onclick="handleResponse('custom', true)"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-3xl font-bold text-lg shadow-xl hover:opacity-90 transition-opacity">
                    네, 지금 보낼래요!
                </button>
                <button onclick="handleResponse('custom', false)"
                    class="w-full py-2 text-gray-400 font-medium hover:text-gray-600">
                    다음에 보낼게요
                </button>
            </div>
        </div>
    </div>

    <script>
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');

        // 팝업 열기/닫기 제어
        function toggleSystem(show) {
            document.getElementById('systemOverlay').classList.toggle('active', show);
        }

        function toggleCustom(show) {
            document.getElementById('customOverlay').classList.toggle('active', show);
        }

        // 응답 처리
        function handleResponse(type, isSent) {
            // 모든 오버레이 닫기
            toggleSystem(false);
            toggleCustom(false);

            if (!isSent) return; // 취소한 경우

            resultBox.classList.remove('hidden');
            if (type === 'system') {
                resultText.innerHTML = "💻 <strong>시스템 팝업</strong>으로 처리되었습니다. <span class='text-gray-400'>(기능은 작동하지만 조금 딱딱하죠?)</span>";
            } else {
                resultText.innerHTML = "✨ <strong>예쁜 모달</strong>로 처리되었습니다. <span class='text-indigo-600'>(선생님의 정성이 학생에게 더 잘 전달될 거예요!)</span>";
            }
        }
    </script>
</body>

</html>
